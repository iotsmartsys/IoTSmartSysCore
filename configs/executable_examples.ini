[example_board_iotsmartsys_mcb_r1]
board = iotsmartsys_mcb_r1
monitor_speed = 115200
upload_speed = 460800

[env:example_basic_light_mcb_r1]
extends = env:base_esp
board = ${example_board_iotsmartsys_mcb_r1.board}
monitor_speed = ${example_board_iotsmartsys_mcb_r1.monitor_speed}
upload_speed = ${example_board_iotsmartsys_mcb_r1.upload_speed}
build_src_filter =
  +<*>
  -<main.cpp>
build_flags =
  ${env:base_esp.build_flags}
  -DAPP_EXAMPLE_RUNNER=1
  -DIOTSMARTSYS_EXAMPLE_BASIC_LIGHT=1
  -DEXAMPLE_BOARD_ID="\"iotsmartsys_mcb_r1\""
  -DEXAMPLE_LIGHT_ACTIVE_HIGH=1

[env:example_environment_dht_mcb_r1]
extends = env:base_esp
board = ${example_board_iotsmartsys_mcb_r1.board}
monitor_speed = ${example_board_iotsmartsys_mcb_r1.monitor_speed}
upload_speed = ${example_board_iotsmartsys_mcb_r1.upload_speed}
build_src_filter =
  +<*>
  -<main.cpp>
lib_deps =
  ${env:base_esp.lib_deps}
  adafruit/Adafruit Unified Sensor@^1.1.15
  adafruit/DHT sensor library@^1.4.6
build_flags =
  ${env:base_esp.build_flags}
  -DAPP_EXAMPLE_RUNNER=1
  -DIOTSMARTSYS_EXAMPLE_ENVIRONMENT_DHT=1
  -DEXAMPLE_BOARD_ID="\"iotsmartsys_mcb_r1\""
  -DDHT_SENSOR_ENABLED=1
  -DEXAMPLE_DHT_READ_INTERVAL_MS=2000

[env:example_screen_console_esp32_dev]
extends = env:esp32_dev
build_src_filter =
  +<*>
  -<main.cpp>
lib_deps =
  ${env:base_esp.lib_deps}
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit ST7735 and ST7789 Library@^1.10.7
build_flags =
  ${env:esp32_dev.build_flags}
  -DAPP_EXAMPLE_RUNNER=1
  -DIOTSMARTSYS_EXAMPLE_SCREEN_CONSOLE=1
  -DIOTSMARTSYS_SCREEN_CONSOLE_ENABLED=1
  -DEXAMPLE_BOARD_ID="\"ideaspark_esp32_1_9_tft\""
  -DEXAMPLE_SCREEN_CS_PIN=15
  -DEXAMPLE_SCREEN_DC_PIN=2
  -DEXAMPLE_SCREEN_RESET_PIN=4
  -DEXAMPLE_SCREEN_CLOCK_PIN=18
  -DEXAMPLE_SCREEN_MOSI_PIN=23
  -DEXAMPLE_SCREEN_BACKLIGHT_PIN=32
  -DEXAMPLE_SCREEN_NATIVE_WIDTH=170
  -DEXAMPLE_SCREEN_NATIVE_HEIGHT=320
  -DEXAMPLE_SCREEN_ROTATION=1

