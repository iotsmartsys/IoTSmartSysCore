; Component-only ADC build matrix. Build object targets; these are not firmware.
[adc1_components]
extends = env:base_esp
extra_scripts =
lib_deps = adafruit/Adafruit INA3221 Library@^1.0.1
build_flags =
  ${env:base_esp.build_flags}
  -DIOTSMARTSYS_SENSORS_ENABLED=1
build_src_filter =
  -<*>
  +<Platform/Arduino/Sensors/NtcTemperatureSensor.cpp>
  +<Platform/Arduino/Sensors/ACS712C30ACurrentSensor.cpp>
  +<Platform/Arduino/Sensors/ResistiveDividerVoltageSensor.cpp>
  +<Platform/Arduino/Factories/ArduinoHardwareAdapterFactory.cpp>
  +<Infra/Factories/SensorFactory.cpp>
  +<App/Builders/Builders/CapabilitiesBuilder.cpp>

[env:adc1_c3_arduino2]
extends = adc1_components
board = esp32-c3-devkitm-1

[env:adc1_esp32_arduino3]
extends = adc1_components
platform = ${env:esp32c6_supermini.platform}
board = esp32dev

[env:adc1_c3_arduino3]
extends = adc1_components
platform = ${env:esp32c6_supermini.platform}
board = esp32-c3-devkitm-1

[env:adc1_s2_arduino3]
extends = adc1_components
platform = ${env:esp32c6_supermini.platform}
board = esp32-s2-saola-1

[env:adc1_s3_arduino3]
extends = adc1_components
platform = ${env:esp32c6_supermini.platform}
board = esp32-s3-devkitc-1

[env:adc1_c5_arduino3]
extends = adc1_components
platform = ${env:esp32c6_supermini.platform}
board = esp32-c5-devkitc-1

[env:adc1_c6_arduino3]
extends = adc1_components
platform = ${env:esp32c6_supermini.platform}
board = esp32-c6-devkitc-1

[env:adc1_h2_arduino3]
extends = adc1_components
platform = ${env:esp32c6_supermini.platform}
board = esp32-h2-devkitm-1

[env:adc1_p4_arduino3]
extends = adc1_components
platform = ${env:esp32c6_supermini.platform}
board = esp32-p4-evboard
