[env:esp32s3_test]
extends = env:base_esp
board = esp32-s3-devkitc-1
test_framework = unity
test_build_src = yes
build_src_filter =
  +<*>
  -<main.cpp>
upload_port = /dev/cu.usbmodem101
; Quarentena decidida pelo Arquiteto em EKM-CHG-0028. Estas são todas as
; suítes existentes em 01/08/2026; ficam preservadas, mas o Test Runner deve
; apresentá-las como SKIPPED sem compilar, carregar ou executar. Novas suítes
; não entram silenciosamente nesta lista.
test_ignore =
  test_binary_capability_state_storage
  test_binary_command_capability_state
  test_builder
  test_capability_identity
  test_garage_control_state
  test_glp_meter
  test_glp_sensor
  test_heightwaterlevel
  test_humidity
  test_mqtt_settings
  test_operational_color_sensor
  test_provisioning_save_gate
  test_service_graph_identity
  test_settings_provider
  test_temperature
  test_waterflow
  test_waterlevelliters
  test_waterlevelpercent
lib_deps =
  ${env:base_esp.lib_deps}
  adafruit/Adafruit INA3221 Library@^1.0.1
lib_ignore =
build_flags =
  ${env:base_esp.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -D BAUD_RATE=115200
  -D PIN_TEST=43
  -D UNIT_TEST_MAIN
  ${env:credentials.build_flags}
