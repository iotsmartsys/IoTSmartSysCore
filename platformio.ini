[env:esp32s3_ia]
extends = env:base_esp
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
upload_port = /dev/cu.usbmodem1101
build_flags = 
	${env:base_esp.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-Wformat=2
	-Wformat-security
	-Werror=format
	-fexceptions
	-fno-exceptions
	-fno-rtti
	-fno-threadsafe-statics
	-DTEMPERATURE_SENSOR_READ_INTERVAL_MS=600000
	-DLUMINOSITY_SENSOR_READ_INTERVAL_MS=6000
	-DLUMINOSITY_SENSOR_VARIATION_TOLERANCE=2.0f
	-DPIR_SENSOR_DEBOUNCE_TIME_MS=60000
	-DIOTSMARTSYS_API_URL="\"https://api.iotsmartsys.tech/devices/api/v1/devices\""
	-DIOTSMARTSYS_API_DEVICE_SETTINGS_ENDPOINT="\"/:device_id/settings\""
lib_deps = 
	${env:base_esp.lib_deps}
  adafruit/Adafruit INA3221 Library@^1.0.1

[env:esp32_dev_min]
build_src_filter = 
	+<*>
	-<Infra/OTA/>
	-<Platform/Espressif/Provisioning/>
	-<Platform/Arduino/Provisioning/>
	-<Infra/display/>
	-<Platform/Arduino/Sensors/>
extends = env:base_esp
board = esp32dev
lib_ldf_mode = chain
lib_compat_mode = strict
lib_ignore = 
	WebServer
	DNSServer
	ESPmDNS
	HTTPClient
	Update
	NetworkClientSecure
build_flags = 
	${env:base_esp.build_flags}
	-Wformat=2
	-Wformat-security
	-Werror=format
	-fexceptions
	-fno-exceptions
	-fno-rtti
	-fno-threadsafe-statics
	-DIOTSMARTSYS_MINIMAL=1
	-DIOTSMARTSYS_PROVISIONING_ENABLED=0
	-DIOTSMARTSYS_SENSORS_ENABLED=0
	-DIOTSMARTSYS_OTA_ENABLED=0
	-DIOTSMARTSYS_REDACT_SECRETS=1
	-DIOTSMARTSYS_LOG_LEVEL=1
	-DBLE_PROVISIONING_CHANNEL_ENABLE=0
	-DWEB_PORTAL_PROVISIONING_CHANNEL_ENABLE=0
	-DWEB_PORTAL_PROVISIONING_CAPTIVE_ENABLE=0
	-DFW_HTTP_UPDATE_DISABLED=1
	-DOTA_DISABLED
lib_deps = adafruit/Adafruit INA3221 Library@^1.0.1

