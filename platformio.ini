lib_ignore = 
build_flags = 
	${env:base_esp.build_flags}
	-DDOUT_PIN=4
	-DSCK_PIN=3
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DLED_PIN=8
	-DIOTSMARTSYS_SENSORS_ENABLED=1

[env:glp_meter_esp32]
extends = env:base_esp
board = esp32dev
monitor_filters = send_on_enter, printable
upload_port = /dev/cu.usbserial-0001
lib_deps = 
	${env:base_esp.lib_deps}
	claws/BH1750@^1.3.0
