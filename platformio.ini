[env:base_esp]
platform = platformio/espressif32@6.5.0
framework = arduino
extra_scripts = pre:tools/generate_wifi_credentials.py
board_build.partitions = partitions/ota_duplo_max_.csv
monitor_speed = 115200
upload_speed = 115200
build_unflags = 
	-std=gnu++11
	-std=gnu++14
	-std=gnu++2a
lib_deps = 
build_flags = 
	-std=gnu++17
	-Os
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-Wl,--cref
	-fno-exceptions
	-fno-rtti
	-fno-threadsafe-statics
	-Wl,--cref
	-DWEB_PORTAL_PROVISIONING_CHANNEL_ENABLE=1
	-DWEB_PORTAL_PROVISIONING_CAPTIVE_ENABLE=0
	-DSERIAL_ENABLED=1
	-DSERIAL_BAUD_RATE=115200
	-DIOTSMARTSYS_ENV_ID="\"${PIOENV}\""
	-DIOTSMARTSYS_OTA_ENABLED=1

[env:esp32s3_test]
extends = env:base_esp
board = esp32-s3-devkitc-1
test_framework = unity
test_build_src = yes
upload_port = /dev/cu.usbmodem101
test_ignore = 
	test_binary_capability_state_storage
	test_binary_command_capability_state
	test_builder
	test_capability_identity
	test_garage_control_state
	test_glp_meter
	test_glp_sensor
	test_heightwaterlevel
	test_humidity
	test_mqtt_settings
	test_operational_color_sensor
	test_provisioning_save_gate
	test_service_graph_identity
	test_settings_provider
	test_temperature
	test_waterflow
	test_waterlevelliters
	test_waterlevelpercent
lib_deps = 
	${env:base_esp.lib_deps}
lib_ignore = 
build_flags = 
	${env:base_esp.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-D BAUD_RATE=115200
	-D PIN_TEST=43
	-D UNIT_TEST_MAIN
	${env:credentials.build_flags}

[env:esp32s3_capacity12_test]
extends = env:esp32s3_test
test_filter = test_capability_identity
test_ignore =
build_flags =
	${env:esp32s3_test.build_flags}
