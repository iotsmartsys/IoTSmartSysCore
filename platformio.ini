lib_ignore = 
build_flags = 
	${env:base_esp.build_flags}
	-DDOUT_PIN=16
	-DSCK_PIN=17
	-DLED_PIN=22
	-DHX711_ENABLED=1
	-DBH1750_ENABLED=1
	-DIOTSMARTSYS_API_URL="\"https://api.iotsmartsys.tech/devices/api/v1/devices\""
	-DIOTSMARTSYS_API_DEVICE_SETTINGS_ENDPOINT="\"/:device_id/settings\""

