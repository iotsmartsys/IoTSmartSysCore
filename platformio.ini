; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32_dev
upload_port = /dev/cu.usbserial-0001
extra_configs = 
	configs/*.ini
	private.ini

[env:ESP32_MCB01]
extends = env:base_esp
board = iotsmartsys_mcb_r1
upload_port = /dev/cu.usbserial-1130
build_src_filter =
	+<*>
	-<main.cpp>
lib_deps = 
	${env:base_esp.lib_deps}
	crankyoldgit/IRremoteESP8266
	adafruit/Adafruit Unified Sensor@^1.1.15
	adafruit/DHT sensor library@^1.4.6
	claws/BH1750@^1.3.0
	milesburton/DallasTemperature@^4.0.4
	adafruit/Adafruit INA3221 Library@^1.0.1
build_flags = 
	${env:base_esp.build_flags}
	-DAPP_EXAMPLE_RUNNER=1
	-DIOTSMARTSYS_EXAMPLE_MCB01_SOLAR_CONTROLLER=1
	-DIOTSMARTSYS_MAX_CAPABILITIES=12
	-DEXAMPLE_BOARD_ID="\"iotsmartsys_mcb_r1\""
	-DDS18B20_SENSOR_ENABLED=1
	-DBH1750_ENABLED=1
	-DTEMPERATURE_SENSOR_READ_INTERVAL_MS=600000
	-DLUMINOSITY_SENSOR_READ_INTERVAL_MS=6000
	-DLUMINOSITY_SENSOR_VARIATION_TOLERANCE=2.0f
	-DPIR_SENSOR_DEBOUNCE_TIME_MS=60000
	-DIOTSMARTSYS_API_URL="\"https://api.iotsmartsys.tech/devices/api/v1/devices\""
	-DIOTSMARTSYS_API_DEVICE_SETTINGS_ENDPOINT="\"/:device_id/settings\""

[env:esp32_dev]
extends = env:base_esp
board = esp32dev
upload_port = /dev/cu.usbserial-0001
build_flags = 
	${env:base_esp.build_flags}
	-DIOTSMARTSYS_OTA_ENABLED=1
	-DBLE_PROVISIONING_CHANNEL_ENABLE=1
	-DLED_PIN=23
	-DLED_BUILTIN=23
	-DESP32_LED_GREEN=LED_PIN
	-DESP32_LED_BLUE=ESP32_LED_BUILTIN
lib_deps = adafruit/Adafruit INA3221 Library@^1.0.1

[env:esp32c6_supermini]
extends = env:base_esp
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitm-1
board_build.partitions = partitions/ota_duplo_max_.csv
lib_deps = 
	${env:base_esp.lib_deps}
	crankyoldgit/IRremoteESP8266
	adafruit/Adafruit INA3221 Library@^1.0.1
build_flags = 
	${env:base_esp.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DIR_REMOTE_ESP8266_ENABLED=1
	-DIOTSMARTSYS_OTA_ENABLED=1
	-DWEB_PORTAL_PROVISIONING_CHANNEL_ENABLE=1
	-DWEB_PORTAL_PROVISIONING_CAPTIVE_ENABLE=0
	-DLED_PIN=15
	-DIOT_FIRMWARE_ENV=\"${PIOENV}\"
	-DDISTANCE_ULTRASONIC_1_ECHO_PIN=1
	-DDISTANCE_ULTRASONIC_1_TRIG_PIN=0
	-DDISTANCE_ULTRASONIC_2_ECHO_PIN=20
	-DDISTANCE_ULTRASONIC_2_TRIG_PIN=19

